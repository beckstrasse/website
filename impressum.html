<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo_transparent.png">
  <title>Impressum – Beckstraße e.V.</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    main {
      max-width: 480px;
      width: 100%;
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 1.5rem;
    }

    p, address {
      font-size: 0.9rem;
      line-height: 1.7;
      font-style: normal;
      opacity: 0.8;
    }

    .section {
      margin-bottom: 1.5rem;
    }

    .label {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.35;
      margin-bottom: 0.3rem;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      opacity: 0.3;
    }
  </style>
</head>
<body>
  <main>
    <h1>Impressum</h1>

    <div class="section">
      <div class="label">Verein</div>
      <address>
        Beckstraße e.V.<br>
        c/o Jonas Budde<br>
        Beckstraße 17<br>
        20357 Hamburg
      </address>
    </div>

    <div class="section">
      <div class="label">Vertreten durch</div>
      <p>Jonas Budde (1. Vorsitzender)</p>
    </div>

    <div class="section">
      <div class="label">Kontakt</div>
      <p><a href="mailto:info@beckstrasse.de">info@beckstrasse.de</a></p>
    </div>

    <div class="section">
      <div class="label">Vereinsregister</div>
      <p>Amtsgericht Hamburg<br>VR 26368</p>
    </div>

    <footer>
      <a href="/">&larr; Zurück</a>
    </footer>
  </main>
</body>
</html>
